<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notas - AdrianMiguel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Notas del semestre</h1>
        <div class="small" id="subtitulo">Cargando…</div>
      </div>
      <nav aria-label="Vistas">
        <button class="btn active" type="button" data-view="resumen">Resumen</button>
        <button class="btn" type="button" data-view="general">Detalle general</button>
        <button class="btn" type="button" data-view="curso">Ver 1 curso</button>
        <button class="btn" type="button" data-view="admin">Admin</button>
      </nav>
    </header>

    <section id="view-resumen" class="grid"></section>

    <section id="view-general" style="display:none;">
      <div class="card">
        <h2>Detalle general</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Curso</th><th>Evaluación</th><th>Nota</th><th>Peso %</th><th>Aporte</th><th>Fecha</th></tr></thead>
            <tbody id="tbody-general"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="view-curso" style="display:none;">
      <div class="card">
        <h2>Ver un curso</h2>
        <div class="course-picker">
          <select class="select" id="select-curso" aria-label="Curso"></select>
          <span class="small">Elegí un curso y te muestro todo su detalle.</span>
        </div>
        <div id="curso-kpis" class="kpis course-kpis"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Evaluación</th><th>Nota</th><th>Peso %</th><th>Aporte</th><th>Fecha</th></tr></thead>
            <tbody id="tbody-curso"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="view-admin" style="display:none;">
      <div id="login-panel" class="card admin-card">
        <h2>Admin</h2>
        <form id="login-form" class="form-stack">
          <label>Email<input class="field" name="email" type="email" autocomplete="username" required></label>
          <label>Contraseña<input class="field" name="password" type="password" autocomplete="current-password" required></label>
          <div><button class="btn" type="submit">Iniciar sesión</button></div>
        </form>
      </div>

      <div id="grade-panel" class="card admin-card" hidden>
        <div class="admin-heading">
          <h2>Agregar evaluación</h2>
          <button id="logout-button" class="btn secondary" type="button">Cerrar sesión</button>
        </div>
        <form id="grade-form" class="form-stack">
          <label>Materia<select class="field" id="admin-course" name="courseId" required></select></label>
          <label>Tipo<select class="field" id="admin-type" name="typeId" required></select></label>
          <label>Nota<input class="field" name="grade" type="number" min="0" max="100" step="0.01" inputmode="decimal" required></label>
          <div><button class="btn" type="submit">Agregar nota</button></div>
        </form>
      </div>
      <p id="admin-message" class="notice" role="status" hidden></p>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
